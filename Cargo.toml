[workspace]
members = ["."]

[package]
name = "voicemorph"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "voicemorph"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac"] }
rustfft = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio"] }
windows-core = "0.58"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 2
